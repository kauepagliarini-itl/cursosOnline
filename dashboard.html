<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel | Plataforma de Cursos Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: { DEFAULT: '#D97757', dark: '#B85C3E', light: '#E8967A' },
          },
          fontFamily: { sans: ['Poppins', 'sans-serif'] },
        },
      },
    };
  </script>
</head>
<body class="font-sans bg-neutral-100 min-h-screen">

  <header class="bg-white border-b border-neutral-200">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-graduation-cap text-accent text-xl"></i>
        <span class="font-semibold text-neutral-800">EduPlat</span>
      </div>
      <div class="flex items-center gap-4">
        <div class="text-right hidden sm:block">
          <p id="user-nome" class="text-sm font-medium text-neutral-800"></p>
          <p id="user-role" class="text-xs text-neutral-500"></p>
        </div>
        <button id="logout-btn" class="text-sm text-neutral-600 hover:text-accent transition-colors">
          <i class="fa-solid fa-right-from-bracket mr-1"></i> Sair
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-10">
    <h1 id="welcome-title" class="text-2xl font-semibold text-neutral-800 mb-1"></h1>
    <p id="welcome-subtitle" class="text-neutral-500 mb-8"></p>

    <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </main>

  <script src="assets/js/auth.js"></script>
  <script>
    const usuario = exigirRole(['aluno', 'editor', 'admin']);

    if (usuario) {
      const ROLE_LABELS = { aluno: 'Aluno', editor: 'Editor', admin: 'Administrador' };

      document.getElementById('user-nome').textContent = usuario.nome;
      document.getElementById('user-role').textContent = ROLE_LABELS[usuario.role] || usuario.role;
      document.getElementById('welcome-title').textContent = `Olá, ${usuario.nome.split(' ')[0]}!`;
      document.getElementById('welcome-subtitle').textContent =
        `Você está logado como ${ROLE_LABELS[usuario.role] || usuario.role}.`;

      // "href" ausente = tela ainda não implementada (card fica sem link por enquanto).
      const MENUS = {
        aluno: [
          { icon: 'fa-book-open', label: 'Catálogo de Cursos' },
          { icon: 'fa-chart-line', label: 'Meu Progresso' },
          { icon: 'fa-user', label: 'Meu Perfil' },
        ],
        editor: [
          { icon: 'fa-layer-group', label: 'Gerenciar Cursos' },
          { icon: 'fa-chalkboard', label: 'Gerenciar Aulas' },
          { icon: 'fa-tags', label: 'Gerenciar Categorias' },
        ],
        admin: [
          { icon: 'fa-users', label: 'Gerenciar Usuários', href: 'usuarios.html' },
          { icon: 'fa-layer-group', label: 'Gerenciar Cursos' },
          { icon: 'fa-chart-pie', label: 'Relatórios' },
        ],
      };

      const grid = document.getElementById('menu-grid');
      (MENUS[usuario.role] || []).forEach((item) => {
        const card = document.createElement(item.href ? 'a' : 'div');
        if (item.href) card.href = item.href;
        card.className = 'bg-white rounded-xl border border-neutral-200 p-6 flex items-center gap-4 hover:border-accent transition-colors cursor-pointer';
        card.innerHTML = `
          <div class="w-10 h-10 rounded-lg bg-accent/10 text-accent flex items-center justify-center">
            <i class="fa-solid ${item.icon}"></i>
          </div>
          <span class="font-medium text-neutral-700">${item.label}</span>
        `;
        grid.appendChild(card);
      });

      configurarLogout();
    }
  </script>
</body>
</html>
