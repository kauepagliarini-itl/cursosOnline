<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Aulas - Painel Editor</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>

<body class="bg-light">

    <!-- Navbar Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="editor-cursos.html">
                <i class="fa-solid fa-graduation-cap me-2"></i>Plataforma Cursos - Painel Editor
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="editor-cursos.html">
                            <i class="fa-solid fa-arrow-left me-1"></i>Voltar para Cursos
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center text-white me-3">
                    <span id="nomeUsuarioLogado" class="fw-semibold">Editor</span>
                </div>
                <button class="btn btn-outline-danger btn-sm" onclick="fazerLogout()">
                    <i class="fa-solid fa-right-from-bracket me-1"></i>Sair
                </button>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <div class="container my-4">
        <!-- Cabeçalho Dinâmico do Curso -->
        <div class="card shadow-sm border-0 mb-4 bg-white">
            <div class="card-body p-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div>
                    <span class="badge bg-primary mb-2">Gerenciamento de Conteúdo</span>
                    <h2 class="fw-bold mb-1" id="tituloCurso">Carregando curso...</h2>
                    <p class="text-muted mb-0" id="detalhesCurso">Aguarde o carregamento das informações.</p>
                </div>
                <button class="btn btn-primary btn-lg" data-bs-toggle="modal" data-bs-target="#modalAula"
                    onclick="prepararModalCriacaoAula()">
                    <i class="fa-solid fa-plus me-1"></i>Nova Aula
                </button>
            </div>
        </div>

        <!-- Tabela de Aulas -->
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center">
                <span><i class="fa-solid fa-list-ol me-2"></i>Aulas do Curso</span>
                <span class="badge bg-secondary" id="totalAulasBadge">0 aulas</span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-secondary">
                            <tr>
                                <th style="width: 80px;">Ordem</th>
                                <th>Título da Aula</th>
                                <th>Duração</th>
                                <th>Link/Conteúdo</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaAulas">
                            <tr>
                                <td colspan="5" class="text-center py-4 text-muted">Carregando aulas...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Criar/Editar Aula -->
    <div class="modal fade" id="modalAula" tabindex="-1" aria-labelledby="modalAulaLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title" id="modalAulaLabel">Nova Aula</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <form id="formAula">
                    <div class="modal-body">
                        <!-- ID Oculto da Aula -->
                        <input type="hidden" id="aulaId">

                        <!-- Título da Aula -->
                        <div class="mb-3">
                            <label for="tituloAula" class="form-label font-weight-bold">Título da Aula</label>
                            <input type="text" class="form-control" id="tituloAula" required
                                placeholder="Ex: Variáveis e Tipos de Dados">
                        </div>

                        <!-- Ordem da Aula -->
                        <div class="mb-3">
                            <label for="ordemAula" class="form-label font-weight-bold">Ordem na Sequência</label>
                            <input type="number" class="form-control" id="ordemAula" required min="1"
                                placeholder="Ex: 1">
                        </div>

                        <!-- Duração em Minutos -->
                        <div class="mb-3">
                            <label for="duracaoMinutos" class="form-label font-weight-bold">Duração (em minutos)</label>
                            <input type="number" class="form-control" id="duracaoMinutos" required min="1"
                                placeholder="Ex: 15">
                        </div>

                        <!-- Conteúdo / Link do Vídeo (Opcional) -->
                        <div class="mb-3">
                            <label for="conteudoAula" class="form-label font-weight-bold">URL do Conteúdo/Vídeo</label>
                            <input type="url" class="form-control" id="conteudoAula"
                                placeholder="Ex: https://video.exemplo.com/aula1">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar Aula</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- CDNs de Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Scripts da Aplicação -->

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/editor-aulas.js"></script>
</body>

</html>
