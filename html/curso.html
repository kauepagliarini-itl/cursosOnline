<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curso | Plataforma de Cursos Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: {
              50: '#EEF1FC',
              100: '#DCE3F7',
              200: '#C3D0F2',
              400: '#8DA0E0',
              DEFAULT: '#4C5FBF',
              dark: '#3B4A99',
              light: '#8DA0E0',
            },
          },
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
            display: ['Fredoka', 'Poppins', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body class="font-sans bg-neutral-100 min-h-screen theme-light">

  <div class="admin-bg"></div>

  <div class="relative z-10">
    <main class="max-w-3xl mx-auto px-6 py-10">
      <a href="/html/catalogo.html" class="inline-flex items-center gap-1.5 text-sm text-neutral-500 hover:text-accent transition-colors mb-4">
        <i class="fa-solid fa-arrow-left"></i> Voltar para o Catálogo
      </a>

      <div id="curso-cabecalho" class="bg-white rounded-xl border border-neutral-200 p-6 mb-5">
        <div class="flex items-start justify-between gap-3 mb-2">
          <span id="curso-categoria-badge" class="text-xs font-medium px-2.5 py-1 rounded-full bg-accent-50 text-accent-dark"></span>
          <span id="curso-matricula-badge" class="hidden text-xs font-medium px-2.5 py-1 rounded-full whitespace-nowrap"></span>
        </div>
        <h1 id="curso-titulo" class="text-2xl font-semibold text-neutral-800 mb-2">—</h1>
        <p id="curso-descricao" class="text-neutral-500 text-sm mb-4"></p>
        <div class="flex items-center gap-4 text-xs text-neutral-400">
          <span><i class="fa-solid fa-clock mr-1"></i><span id="curso-carga-horaria"></span>h</span>
          <span><i class="fa-solid fa-chalkboard-user mr-1"></i><span id="curso-instrutor"></span></span>
        </div>
      </div>

      <!-- Matrícula / progresso (só para aluno) -->
      <div id="secao-matricula" class="hidden bg-white rounded-xl border border-neutral-200 p-6 mb-5">
        <h2 class="font-semibold text-neutral-800 mb-4">Meu progresso</h2>
        <div class="flex items-center justify-between text-sm mb-1.5">
          <span class="text-neutral-600">Concluído</span>
          <span id="progresso-valor-texto" class="text-neutral-800 font-medium">0%</span>
        </div>
        <div class="strength-bar-track mb-4">
          <div id="progresso-barra" class="strength-bar-fill" style="width:0%"></div>
        </div>
        <div class="flex items-center gap-3">
          <input type="range" id="progresso-slider" min="0" max="100" step="5" class="w-full" />
          <button type="button" id="btn-salvar-progresso" class="submit-btn w-auto px-4 whitespace-nowrap">Salvar</button>
        </div>
        <p class="text-xs text-neutral-400 mt-2">Ao chegar em 100%, o curso é marcado automaticamente como concluído.</p>
      </div>

      <!-- Matricular-se (aluno ainda não matriculado) -->
      <div id="secao-matricular" class="hidden bg-white rounded-xl border border-dashed border-accent/40 p-6 mb-5 text-center">
        <p class="text-neutral-600 text-sm mb-3">Você ainda não está matriculado neste curso.</p>
        <button type="button" id="btn-matricular" class="submit-btn w-auto px-6 mx-auto">
          <i class="fa-solid fa-graduation-cap mr-2"></i> Matricular-se
        </button>
      </div>

      <!-- Aulas -->
      <div class="bg-white rounded-xl border border-neutral-200 p-6 mb-5">
        <h2 class="font-semibold text-neutral-800 mb-4">Aulas</h2>
        <div id="lista-aulas" class="space-y-2"></div>
        <p id="aulas-vazio" class="hidden text-sm text-neutral-400">Este curso ainda não tem aulas cadastradas.</p>
      </div>

      <!-- Avaliação (só para aluno com matrícula concluída) -->
      <div id="secao-avaliacao" class="hidden bg-white rounded-xl border border-neutral-200 p-6">
        <h2 class="font-semibold text-neutral-800 mb-4">Avaliação</h2>

        <div id="avaliacao-existente" class="hidden"></div>

        <form id="form-avaliacao">
          <div class="mb-4">
            <label class="block text-sm text-neutral-600 mb-2">Sua nota</label>
            <div id="estrelas-avaliacao" class="flex items-center gap-2 text-2xl"></div>
            <input type="hidden" id="avaliacao-nota" />
            <p class="field-error" data-error-for="avaliacao-nota"></p>
          </div>
          <div class="mb-4">
            <label for="avaliacao-comentario" class="block text-sm text-neutral-600 mb-1.5">
              Comentário <span class="text-neutral-400">(opcional, até 500 caracteres)</span>
            </label>
            <textarea id="avaliacao-comentario" rows="3" maxlength="500" class="modal-input resize-none"></textarea>
          </div>
          <button type="submit" id="btn-enviar-avaliacao" class="submit-btn w-auto px-5">
            <span id="btn-enviar-avaliacao-text">Enviar avaliação</span>
            <i class="fa-solid fa-circle-notch fa-spin spinner hidden ml-2"></i>
          </button>
        </form>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanta/0.5.24/vanta.net.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/background.js"></script>
  <script src="/assets/js/shell.js"></script>
  <script src="/assets/js/curso.js"></script>
  <script src="/assets/js/acessibilidade.js"></script>
  <script src="/assets/js/cookies.js"></script>
  <script src="/assets/js/footer.js"></script>
</body>
</html>
