<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Histórico de Relatórios | Plataforma de Cursos Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: {
              50: '#EEF1FC',
              100: '#DCE3F7',
              200: '#C3D0F2',
              400: '#8DA0E0',
              DEFAULT: '#4C5FBF',
              dark: '#3B4A99',
              light: '#8DA0E0',
            },
          },
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
            display: ['Fredoka', 'Poppins', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body class="font-sans bg-neutral-100 min-h-screen theme-light">

  <div class="admin-bg"></div>

  <div class="relative z-10">
    <main class="max-w-6xl mx-auto px-6 py-10">
      <h1 class="text-2xl font-semibold text-neutral-800 mb-1">Histórico de Relatórios</h1>
      <p class="text-neutral-500 text-sm mb-6">Quem extraiu ou enviou relatórios, quando e em qual formato.</p>

      <!-- FILTROS -->
      <div class="bg-white rounded-xl border border-neutral-200 p-4 mb-4 flex flex-col sm:flex-row gap-3">
        <input
          type="text"
          id="filtro-busca"
          placeholder="Buscar por usuário..."
          class="modal-input flex-1"
        />
        <select id="filtro-acao" class="modal-input select-custom sm:w-48">
          <option value="">Todas as ações</option>
          <option value="download">Extraiu arquivo</option>
          <option value="email">Enviou por e-mail</option>
        </select>
        <select id="filtro-formato" class="modal-input select-custom sm:w-40">
          <option value="">Todos os formatos</option>
          <option value="xlsx">Excel</option>
          <option value="csv">CSV</option>
          <option value="xml">XML</option>
        </select>
      </div>

      <div class="bg-white rounded-xl border border-neutral-200 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-neutral-50 text-neutral-500 text-left">
            <tr>
              <th class="px-5 py-3 font-medium">Usuário</th>
              <th class="px-5 py-3 font-medium">Ação</th>
              <th class="px-5 py-3 font-medium">Formato</th>
              <th class="px-5 py-3 font-medium">Destinatário</th>
              <th class="px-5 py-3 font-medium">Data/Hora</th>
            </tr>
          </thead>
          <tbody id="tabela-logs" class="divide-y divide-neutral-100 text-neutral-700"></tbody>
        </table>
        <p id="estado-vazio" class="hidden text-center text-neutral-500 py-10">Nenhum registro encontrado.</p>
      </div>

      <!-- PAGINAÇÃO -->
      <div class="flex flex-col sm:flex-row items-center justify-between gap-3 mt-4 text-sm text-neutral-600">
        <div class="flex items-center gap-2">
          <span>Itens por página:</span>
          <select id="itens-por-pagina" class="modal-input select-custom w-auto py-1.5">
            <option value="10">10</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </div>
        <div class="flex items-center gap-3">
          <span id="paginacao-info"></span>
          <button id="btn-pagina-anterior" type="button" class="pagination-btn" aria-label="Página anterior">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <button id="btn-pagina-proxima" type="button" class="pagination-btn" aria-label="Próxima página">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanta/0.5.24/vanta.net.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/background.js"></script>
  <script src="/assets/js/shell.js"></script>
  <script src="/assets/js/relatorios-logs.js"></script>
  <script src="/assets/js/acessibilidade.js"></script>
  <script src="/assets/js/cookies.js"></script>
  <script src="/assets/js/footer.js"></script>
</body>
</html>
