<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Gestão de Usuários</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>

<body class="bg-light">

    <!-- Navbar Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fa-solid fa-graduation-cap me-2"></i>Plataforma Cursos - Admin
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="admin-usuarios.html">
                            <i class="fa-solid fa-users me-1"></i>Usuários
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="editor-cursos.html">
                            <i class="fa-solid fa-book me-1"></i>Gerenciar Cursos
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center text-white me-3">
                    <span id="nomeUsuarioLogado" class="fw-semibold">Admin</span>
                </div>
                <button class="btn btn-outline-danger btn-sm" onclick="fazerLogout()">
                    <i class="fa-solid fa-right-from-bracket me-1"></i>Sair
                </button>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-0">Gestão de Usuários</h2>
                <p class="text-muted mb-0">Gerencie usuários, permissões (roles) e acesse/desative contas.</p>
            </div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalUsuario"
                onclick="prepararModalCriacao()">
                <i class="fa-solid fa-plus me-1"></i>Novo Usuário
            </button>
        </div>

        <!-- Tabela de Usuários -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Nome</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaUsuarios">
                            <!-- Preenchido via JavaScript -->
                            <tr>
                                <td colspan="5" class="text-center py-4">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Carregando...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Criar/Editar Usuário -->
    <div class="modal fade" id="modalUsuario" tabindex="-1" aria-labelledby="modalUsuarioLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title" id="modalUsuarioLabel">Novo Usuário</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <form id="formUsuario">
                    <div class="modal-body">
                        <!-- Campo Oculto para ID (Edição) -->
                        <input type="hidden" id="usuarioId">

                        <!-- Nome -->
                        <div class="mb-3">
                            <label for="nome" class="form-label font-weight-bold">Nome Completo</label>
                            <input type="text" class="form-control" id="nome" required minlength="3"
                                placeholder="Ex: Maria Silva">
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label font-weight-bold">E-mail</label>
                            <input type="email" class="form-control" id="email" required
                                placeholder="Ex: maria@email.com">
                        </div>

                        <!-- Senha -->
                        <div class="mb-3">
                            <label for="senha" class="form-label font-weight-bold">Senha</label>
                            <input type="password" class="form-control" id="senha" required minlength="6"
                                placeholder="Mínimo 6 caracteres">
                        </div>

                        <!-- Role -->
                        <div class="mb-3">
                            <label for="role" class="form-label font-weight-bold">Perfil (Role)</label>
                            <select class="form-select" id="role" required>
                                <option value="aluno">Aluno</option>
                                <option value="editor">Editor (Gerenciador de Conteúdo)</option>
                                <option value="admin">Administrador</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar Usuário</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- CDNs de Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Scripts da Aplicação (Localizados na pasta js/) -->
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/admin-usuarios.js"></script>

</body>

</html>
