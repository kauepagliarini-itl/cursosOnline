<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Cursos | Plataforma de Cursos Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: {
              50: '#EEF1FC',
              100: '#DCE3F7',
              200: '#C3D0F2',
              400: '#8DA0E0',
              DEFAULT: '#4C5FBF',
              dark: '#3B4A99',
              light: '#8DA0E0',
            },
          },
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
            display: ['Fredoka', 'Poppins', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="font-sans bg-neutral-100 min-h-screen theme-light">

  <div class="admin-bg"></div>

  <div class="relative z-10">
    <main class="max-w-6xl mx-auto px-6 py-10">
      <h1 class="text-2xl font-semibold text-neutral-800 mb-1">Catálogo de Cursos</h1>
      <p class="text-neutral-500 text-sm mb-6">Explore os cursos publicados e matricule-se no que combinar com você.</p>

      <!-- FILTROS -->
      <div class="bg-white rounded-xl border border-neutral-200 p-4 mb-6 flex flex-col sm:flex-row gap-3">
        <input
          type="text"
          id="filtro-busca"
          placeholder="Buscar por título..."
          class="modal-input flex-1"
        />
        <select id="filtro-categoria" class="modal-input select-custom sm:w-56">
          <option value="">Todas as categorias</option>
        </select>
      </div>

      <div id="catalogo-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      <p id="estado-vazio" class="hidden text-center text-neutral-500 py-16">Nenhum curso encontrado.</p>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanta/0.5.24/vanta.net.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/background.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/catalogo.js"></script>
</body>
</html>
